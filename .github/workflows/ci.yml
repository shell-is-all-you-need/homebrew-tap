name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-script:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compile updater
        run: python3 -I -c "import ast, pathlib; ast.parse(pathlib.Path('scripts/update.py').read_text())"
      - name: Dry-run updater
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -I scripts/update.py --dry-run

  install:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@1f8e202ffddf94def7f42f6fa3a482e821489f9c # 2026.07.10.1
      - name: Install formula
        run: brew install shell-is-all-you-need/tap/shell-is-all-you-need
      - name: Test formula
        run: brew test shell-is-all-you-need/tap/shell-is-all-you-need
      - name: Check command
        run: shell-is-all-you-need --version
