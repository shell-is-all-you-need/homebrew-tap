name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@1f8e202ffddf94def7f42f6fa3a482e821489f9c # 2026.07.10.1
      - name: Install formula
        run: brew install shell-is-all-you-need/tap/shell-is-all-you-need
      - name: Test formula
        run: brew test shell-is-all-you-need/tap/shell-is-all-you-need
      - name: Check command
        run: shell-is-all-you-need --version
